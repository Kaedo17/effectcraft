[package]
name = "effectcraft-android"
description = "EffectCraft's Android entry point: the NativeActivity android_main trampoline that opens the shared app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# NativeActivity loads this library and calls its android_main.
crate-type = ["cdylib"]

# This crate deliberately does not inherit the workspace lints. Android's NativeActivity ABI
# requires an unmangled android_main export, and on edition 2024 that spelling
# (#[unsafe(no_mangle)]) trips rust's unsafe_code lint, which the workspace forbids. The crate
# holds no unsafe logic — one export attribute on a safe trampoline that calls effectcraft::run
# and logs its result — so it denies everything else instead.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"

[dependencies]
effectcraft = { path = "../effectcraft" }
log = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", default-features = false, features = ["native-activity"] }

[package.metadata.android]
package = "ai.storyteller.effectcraft"
apk_name = "effectcraft"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 35

[package.metadata.android.application]
label = "EffectCraft"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|smallestScreenSize|density|layoutDirection"
label = "EffectCraft"
launch_mode = "singleTask"
orientation = "landscape"
exported = true
